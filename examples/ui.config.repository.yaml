profiles:
  guided:
    label: 手順を確認しながら使う
    context:
      audience:
        - 利用頻度が低く、申請手順を確認したい人
      usage: 必要な説明を確認しながら一件ずつ申請する
      goals:
        - 必須項目と提出前の確認内容を理解する
      constraints:
        - 説明を増やして主操作を埋もれさせない
    guidance: >-
      目的、必須項目、操作結果を順に示す。初めて使う人に必要な補助説明を入力欄の近くに置く。入力を段階に分けるかどうかは、業務の手順に合わせて判断する。比較に必要な重要な情報は残す。
    semantic: {}
  dense:
    label: 一覧と入力を繰り返し使う
    context:
      audience:
        - 手順を把握し、複数件を比較して処理する人
      usage: 業務中に一覧の比較と入力を繰り返す
      goals:
        - 必要な比較情報を保ち、対象の申請を効率よく処理する
      constraints:
        - 操作の対象と結果を省略しない
        - 入力方法と44px以上の主操作領域を維持する
    guidance: >-
      一覧では比較する項目を揃え、繰り返し使う操作を対象の近くに置く。詳細説明を折りたたむかどうかは、説明の必要性に応じて判断する。情報を詰め込むために、欠損情報や復旧方法を隠さない。
    semantic:
      size.avatar: avatar-dense
      text.avatar: avatar-dense
      size.form-label: form-label-dense
      size.drawer-inline: drawer-inline-dense
      size.drawer-block: drawer-block-dense
      size.navigation-rail: navigation-rail-dense
      size.mega-menu: mega-menu-dense
      size.navigation-column: navigation-column-dense
      size.knob: knob-dense
      size.collection-item: collection-item-dense
      size.collection-viewport: collection-viewport-dense
      color.action: green
      color.action-hover: green-hover
      color.link: green
      color.tab-selected: green
      color.focus: green
      text.body: text-dense
      text.small: small-dense
      text.heading: heading-dense
      space.page: space-16
      space.section: space-16
      space.field: space-16
      space.control-x: space-16
      space.control-y: space-8
      space.control-gap: space-8
      space.table-x: space-12
      space.table-y: space-8
      radius.control: round-dense
      radius.surface: surface-dense

checks:
  source_roots: [ tests/fixture-app, templates/angular ]
  tsconfig: tsconfig.json
  approved_components:
    - {
        module: '@angular/cdk/bidi',
        export: Dir,
        reason: CDKの公開Directionalityをnative dirへ接続する
      }
    - {
        module: '@angular/cdk/scrolling',
        export: CdkVirtualScrollViewport,
        reason: 公開CDK viewportによる仮想一覧
      }
    - {
        module: '@angular/cdk/scrolling',
        export: CdkFixedSizeVirtualScroll,
        reason: 公開CDK固定行高の仮想一覧
      }
    - {
        module: '@angular/cdk/scrolling',
        export: CdkVirtualForOf,
        reason: 公開CDK仮想行template
      }
    - { module: '@angular/cdk/drag-drop', export: CdkDropList, reason: 公開CDKの移動領域 }
    - {
        module: '@angular/cdk/drag-drop',
        export: CdkDropListGroup,
        reason: 公開CDKの領域間移動
      }
    - {
        module: '@angular/cdk/drag-drop',
        export: CdkDrag,
        reason: 公開CDKのpointer移動とkeyboard代替
      }
    - {
        module: '@angular/cdk/drag-drop',
        export: CdkDragHandle,
        reason: 公開CDKの移動handle
      }
    - {
        module: '@angular/cdk/drag-drop',
        export: CdkDragPlaceholder,
        reason: 公開CDKの移動中placeholder
      }
    - {
        module: '@lucide/angular',
        export: LucideDynamicIcon,
        reason: 採用したLucideの公開SVG directive
      }
  exceptions:
    - file: templates/angular/specialist-browser.ts
      rule: token-category
      source: inline-size:var(--ui-text-body)
      reason: 描画エンジンへ渡す文字サイズを隠したDOM probeでpxへ変換する測定用途。画面上の配置寸法としてtextトークンを使うものではない。
    - file: templates/angular/specialist-browser.ts
      rule: token-category
      source: inline-size:var(--ui-radius-control)
      reason: 描画エンジンへ渡す角丸を隠したDOM probeでpxへ変換する測定用途。画面上の配置寸法としてradiusトークンを使うものではない。
    - file: templates/angular/actions.ts
      rule: literal-token
      source: :host{max-inline-size:calc(100vw - 2*var(--ui-space-page))}
      reason: 実viewport／親領域を上限とする配置比率。狭幅・文字拡大で内容を表示領域内に保ち、内側の余白や部品寸法は意味トークンへ接続する。
    - file: templates/angular/anchor-navigation.ts
      rule: literal-token
      source: nav{max-block-size:calc(100dvh - var(--ui-anchor-offset))}
      reason: 実viewport／親領域を上限とする配置比率。狭幅・文字拡大で内容を表示領域内に保ち、内側の余白や部品寸法は意味トークンへ接続する。
    - file: templates/angular/calendar.ts
      rule: literal-token
      source: table{min-inline-size:calc(7 * max(var(--ui-size-control), 2em +
        var(--ui-space-control-gap)))}
      reason: Calendarの二桁の日付を文字拡大後も切らずに表示する文字幅の下限。操作領域の下限はsize.controlへ接続する。
    - file: templates/angular/card.ts
      rule: literal-token
      source: "@media (max-width:40rem)"
      reason: レスポンシブ配置の切替境界。CSSのmedia queryでは意味CSS変数を参照できないため、この境界を個別に固定する。
    - file: templates/angular/choice-controls.ts
      rule: literal-token
      source: .ui-knob:focus-within{border-radius:50%}
      reason: 円形部品は親の実寸に対する半径50%で形状を維持する。固定pixelの角丸やprofileのsurface半径とは用途が異なる。
    - file: templates/angular/collection-views.ts
      rule: literal-token
      source: stroke-width:2
      reason: 24単位のSVG矢印の線幅2はglyph座標の描画データ。表示寸法と色はsize.icon／color.mutedに追随する。
      line: 58
      column: 995
    - file: templates/angular/collection-views.ts
      rule: literal-token
