  color.text: ink
  color.muted: muted
  color.surface: white
  color.background: canvas
  color.border: outline
  color.action: blue
  color.action-hover: blue-hover
  color.on-action: white
  color.link: blue
  color.tab-selected: blue
  color.danger: red
  color.danger-hover: red-hover
  color.on-danger: white
  color.success: green
  color.success-surface: success-wash
  color.warning: warning-ink
  color.warning-surface: warning-wash
  color.error-surface: error-wash
  color.focus: blue
  color.disabled-surface: disabled-wash
  color.backdrop: backdrop
  color.shadow: outline
  font.body: system-font
  font.code: code-font
  size.avatar: avatar-guided
  text.avatar: avatar-guided
  opacity.map-region: map-region-opacity
  opacity.watermark: watermark-opacity
  text.body: text-guided
  text.small: small-guided
  text.heading: heading-guided
  text.page-title: heading-guided
  text.section-title: section-title-guided
  text.subheading: subheading-guided
  leading.body: leading-body
  leading.heading: leading-heading
  leading.control: leading-control
  weight.body: regular
  weight.heading: bold
  weight.control: semibold
  space.page: space-32
  space.section: space-32
  space.field: space-24
  space.control-x: space-24
  space.control-y: space-12
  space.control-gap: space-12
  space.table-x: space-16
  space.table-y: space-12
  radius.control: round-guided
  radius.surface: surface-guided
  size.control: control-minimum
  size.icon: icon
  size.dialog: dialog
  size.content: content
  size.table-column-min: table-column-min
  size.table-viewport: table-viewport
  size.media-viewport: table-viewport
  size.visualization-viewport: table-viewport
  size.input-max-height: input-max-height
  size.form-label: form-label-guided
  size.grid-item: grid-item
  size.sidebar: sidebar
  size.navigation-rail: navigation-rail-guided
  size.mega-menu: mega-menu-guided
  size.navigation-column: navigation-column-guided
  size.knob: knob-guided
  size.collection-item: collection-item-guided
  size.collection-viewport: collection-viewport-guided
  size.elevation-blur: elevation-blur
  size.overlay-min: overlay-min
  size.dialog-min: dialog-min
  size.drawer-inline: drawer-inline-guided
  size.drawer-block: drawer-block-guided
  border.control: border-thin
  border.focus: focus-width
  border.focus-offset: focus-offset
  motion.duration: duration
  motion.easing: easing

profiles:
  guided:
    label: Guided use
    context:
      audience:
        - Occasional users who need to check the application procedure
      usage: Submit applications one at a time while reading the relevant guidance
      goals:
        - Understand required fields and what to review before submission
      constraints:
        - Keep the primary action easy to find as explanations are added
    guidance: >-
      Show the goal, required fields and results in order. Place guidance near
      the relevant input. Choose steps to match the workflow and retain
      information needed for comparison.
    semantic: {}
  dense:
    label: Repeated list and input use
    context:
      audience:
        - Experienced users comparing and processing multiple applications
      usage: Repeatedly compare lists and enter data during daily work
      goals:
        - Keep necessary comparison information and process the selected
          applications efficiently
      constraints:
        - Keep action targets and results explicit
        - Retain input methods and primary action targets of at least 44px
    guidance: >-
      Align comparison fields and place repeated actions near their targets.
      Collapse details only when appropriate. Keep missing information and
      recovery paths visible.
    semantic:
      size.avatar: avatar-dense
      text.avatar: avatar-dense
      size.form-label: form-label-dense
      size.drawer-inline: drawer-inline-dense
      size.drawer-block: drawer-block-dense
      size.navigation-rail: navigation-rail-dense
      size.mega-menu: mega-menu-dense
      size.navigation-column: navigation-column-dense
      size.knob: knob-dense
      size.collection-item: collection-item-dense
      size.collection-viewport: collection-viewport-dense
      color.action: green
      color.action-hover: green-hover
      color.link: green
      color.tab-selected: green
      color.focus: green
      text.body: text-dense
      text.small: small-dense
      text.heading: heading-dense
      text.page-title: heading-dense
      text.section-title: section-title-dense
      text.subheading: subheading-dense
      space.page: space-16
      space.section: space-24
      space.field: space-16
      space.control-x: space-16
      space.control-y: space-8
      space.control-gap: space-8
      space.table-x: space-12
      space.table-y: space-8
      radius.control: round-dense
      radius.surface: surface-dense

checks:
  source_roots:
    - src
  approved_components: []
  exceptions: []
default_language: en
