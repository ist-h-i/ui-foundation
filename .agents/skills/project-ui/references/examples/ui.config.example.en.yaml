# Starter configuration. Edit your app’s ui.config.yaml.
# Context and guidance inform screen design. The CLI does not infer token values from prose.

schema_version: 1
context:
  product: Application management
  goals:
    - Review the required information to submit, approve or return an application
  constraints:
    - Do not present unavailable information as verified
    - Keep user input during partial failures
output: .ui/generated
default_profile: guided

primitives:
  ink: { type: color, value: '#1c293d' }
  muted: { type: color, value: '#526075' }
  white: { type: color, value: '#ffffff' }
  canvas: { type: color, value: '#f5f7fa' }
  outline: { type: color, value: '#778496' }
  blue: { type: color, value: '#1856a6' }
  blue-hover: { type: color, value: '#10427f' }
  green: { type: color, value: '#175c3a' }
  green-hover: { type: color, value: '#0f462c' }
  red: { type: color, value: '#a32121' }
  red-hover: { type: color, value: '#801919' }
  success-wash: { type: color, value: '#eaf6ef' }
  warning-ink: { type: color, value: '#694700' }
  warning-wash: { type: color, value: '#fff4d6' }
  error-wash: { type: color, value: '#fff0ef' }
  disabled-wash: { type: color, value: '#e7ebf0' }
  backdrop: { type: color, value: '#172033' }
  system-font:
    type: fontFamily
    value: 'system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif'
  code-font:
    {
      type: fontFamily,
      value: 'ui-monospace, "SFMono-Regular", Consolas, monospace'
    }
  avatar-guided: { type: length, value: 64px }
  avatar-dense: { type: length, value: 48px }
  map-region-opacity: { type: number, value: 0.25 }
  watermark-opacity: { type: number, value: 0.12 }
  text-guided: { type: length, value: 1.125rem }
  text-dense: { type: length, value: 1rem }
  small-guided: { type: length, value: 1rem }
  small-dense: { type: length, value: 0.875rem }
  heading-guided: { type: length, value: 1.75rem }
  heading-dense: { type: length, value: 1.5rem }
  section-title-guided: { type: length, value: 1.5rem }
  section-title-dense: { type: length, value: 1.25rem }
  subheading-guided: { type: length, value: 1.25rem }
  subheading-dense: { type: length, value: 1.125rem }
  leading-body: { type: number, value: 1.6 }
  leading-heading: { type: number, value: 1.35 }
  leading-control: { type: number, value: 1.5 }
  regular: { type: number, value: 400 }
  semibold: { type: number, value: 600 }
  bold: { type: number, value: 700 }
  space-8: { type: length, value: 8px }
  space-12: { type: length, value: 12px }
  space-16: { type: length, value: 16px }
  space-24: { type: length, value: 24px }
  space-32: { type: length, value: 32px }
  round-guided: { type: length, value: 12px }
  round-dense: { type: length, value: 4px }
  surface-guided: { type: length, value: 16px }
  surface-dense: { type: length, value: 6px }
  control-minimum: { type: length, value: 44px }
  icon: { type: length, value: 20px }
  dialog: { type: length, value: 640px }
  content: { type: length, value: 1120px }
  table-column-min: { type: length, value: 128px }
  table-viewport: { type: length, value: 480px }
  input-max-height: { type: length, value: 320px }
  form-label-guided: { type: length, value: 12rem }
  form-label-dense: { type: length, value: 9rem }
  grid-item: { type: length, value: 256px }
  sidebar: { type: length, value: 256px }
  navigation-rail-guided: { type: length, value: 72px }
  navigation-rail-dense: { type: length, value: 64px }
  mega-menu-guided: { type: length, value: 960px }
  mega-menu-dense: { type: length, value: 768px }
  navigation-column-guided: { type: length, value: 192px }
  navigation-column-dense: { type: length, value: 160px }
  knob-guided: { type: length, value: 160px }
  knob-dense: { type: length, value: 128px }
  collection-item-guided: { type: length, value: 5rem }
  collection-item-dense: { type: length, value: 4rem }
  collection-viewport-guided: { type: length, value: 20rem }
  collection-viewport-dense: { type: length, value: 16rem }
  elevation-blur: { type: length, value: 12px }
  overlay-min: { type: length, value: 192px }
  dialog-min: { type: length, value: 280px }
  drawer-inline-guided: { type: length, value: 384px }
  drawer-inline-dense: { type: length, value: 320px }
  drawer-block-guided: { type: length, value: 480px }
  drawer-block-dense: { type: length, value: 400px }
  border-thin: { type: length, value: 1px }
