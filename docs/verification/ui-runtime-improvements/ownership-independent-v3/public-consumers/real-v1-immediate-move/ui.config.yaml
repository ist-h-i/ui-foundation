profiles:
  dense:
    label: 移動後の一覧
    context:
      audience:
        - 手順を把握し、複数件を比較して処理する人
      usage: 業務中に一覧の比較と入力を繰り返す
      goals:
        - 必要な比較情報を保ち、対象の申請を効率よく処理する
      constraints:
        - 操作の対象と結果を省略しない
        - 入力方法と44px以上の主操作領域を維持する
    guidance: 一覧の比較軸を揃え、繰り返す操作を対象の近くに置く。詳細説明の開閉は 必要性から判断し、欠損と復旧経路を密度のために隠さない。
    semantic:
      color.action: green
      color.action-hover: green-hover
      color.focus: green
      color.link: green
      color.tab-selected: green
      radius.control: round-dense
      radius.surface: surface-dense
      size.avatar: avatar-dense
      size.collection-item: collection-item-dense
      size.collection-viewport: collection-viewport-dense
      size.drawer-block: drawer-block-dense
      size.drawer-inline: drawer-inline-dense
      size.form-label: form-label-dense
      size.knob: knob-dense
      size.mega-menu: mega-menu-dense
      size.navigation-column: navigation-column-dense
      size.navigation-rail: navigation-rail-dense
      space.control-gap: space-8
      space.control-x: space-16
      space.control-y: space-8
      space.field: space-16
      space.page: space-16
      space.section: space-16
      space.table-x: space-12
      space.table-y: space-8
      text.body: text-dense
      text.heading: heading-dense
      text.small: small-dense
  guided:
    label: 手順を確認しながら使う
    context:
      audience:
        - 利用頻度が低く、申請手順を確認したい人
      usage: 必要な説明を確認しながら一件ずつ申請する
      goals:
        - 必須項目と提出前の確認内容を理解する
      constraints:
        - 説明を増やして主操作を埋もれさせない
    guidance: 目的、必須項目、操作結果を順に示す。初回に必要な補助説明を入力の近くに置き、 段階的な入力が適切か業務の手順から判断する。重要な比較情報は残す。
    semantic: {}
